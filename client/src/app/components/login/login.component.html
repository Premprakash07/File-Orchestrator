<div class="form-container">
    <h2 class="text-center mb-20">{{ 'auth.login.title' | translate }}</h2>

    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="username">{{ 'auth.login.username' | translate }}</label>
            <input type="text" id="username" formControlName="username"
                [placeholder]="'auth.login.usernamePlaceholder' | translate" />
            <div class="error" *ngIf="
          loginForm.get('username')?.invalid &&
          loginForm.get('username')?.touched
        ">
                {{ 'auth.login.usernameRequired' | translate }}
            </div>
        </div>

        <div class="form-group">
            <label for="password">{{ 'auth.login.password' | translate }}</label>
            <input type="password" id="password" formControlName="password"
                [placeholder]="'auth.login.passwordPlaceholder' | translate" />
            <div class="error" *ngIf="
          loginForm.get('password')?.invalid &&
          loginForm.get('password')?.touched
        ">
                {{ 'auth.login.passwordRequired' | translate }}
            </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
            {{ 'auth.login.loginButton' | translate }}
        </button>

        <button type="button" class="btn-link" (click)="goToSignup()">
            {{ 'auth.login.signupLink' | translate }}
        </button>
    </form>
</div>
